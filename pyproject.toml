[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ctxnorm"
version = "0.1.0"
description = "Normalise LLM providers' context-window exhaustion into one error shape that clients can recover from."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "crossVault GmbH" }]
keywords = ["llm", "openai", "anthropic", "context-window", "proxy", "claude-code", "vllm", "llama.cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crossvault/ctxnorm"
Source = "https://github.com/crossvault/ctxnorm"
Issues = "https://github.com/crossvault/ctxnorm/issues"
Changelog = "https://github.com/crossvault/ctxnorm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5", "reuse[charset-normalizer]>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxnorm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "vectors", "LICENSES", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "REUSE.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]
